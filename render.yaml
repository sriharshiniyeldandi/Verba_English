services:
  - type: web
    name: verba-english-9
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://verba-spokenenglishassistant.onrender.com,https://verba-frontend.onrender.com,http://localhost:3000
      - key: SPEECH_PROVIDER
        value: groq
      - key: AI_ANALYSIS_PROVIDER
        value: groq
      - key: APP_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: verba-spokenenglishassistant
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://verba-english-9.onrender.com
